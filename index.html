<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Türksat Frekans Rehberi & Hızlı Arama</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuse.js -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 500: '#14b8a6' } }
        }
      }
    }
  </script>
</head>
<body class="min-h-full flex flex-col antialiased selection:bg-teal-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 sm:py-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 rounded-xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-2xl shadow-inner">
          📡
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Türksat Frekans</h1>
          <p class="text-xs sm:text-sm text-slate-400">Güncel kanal listesi</p>
        </div>
      </div>
      <div id="stats" class="text-sm font-semibold bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-700 text-slate-300">
        Yükleniyor...
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 sm:py-8">
    
    <!-- Filtre Paneli -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-xl mb-6 sm:mb-8">
      
      <!-- Belirginleştirilmiş Arama Çubuğu -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-teal-400">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <input 
          type="text" 
          id="searchInput"
          placeholder="Kanal adını buraya yazın..."
          class="w-full pl-16 pr-14 py-4 sm:py-5 rounded-2xl bg-slate-950 border-2 border-teal-500 text-white placeholder-slate-400 text-lg sm:text-xl font-bold focus:outline-none focus:ring-4 focus:ring-teal-500/40 transition shadow-inner"
          autocomplete="off"
        >
        <button id="clearSearch" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white">
          <div class="bg-slate-800 rounded-full p-2 border border-slate-700 shadow">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </div>
        </button>
      </div>

      <!-- Mobil İçin Filtreleri Göster / Gizle Butonu -->
      <button id="toggleFiltersBtn" class="w-full md:hidden flex items-center justify-center gap-2 mt-5 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-base font-bold transition shadow">
        <svg id="filterIcon" class="w-6 h-6 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        <span id="filterBtnText">Detaylı Filtreleri Göster</span>
      </button>

      <!-- Select Filtreleri (Mobilde Gizli) -->
      <div id="filterSectionWrapper" class="hidden md:block mt-5 pt-5 border-t border-slate-800 md:mt-6 md:pt-0 md:border-0">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-slate-400 mb-2">Kapsama</label>
            <select id="filterKapsama" class="bg-slate-950 border-2 border-slate-800 rounded-xl px-4 py-3.5 text-base text-slate-200 font-medium focus:ring-2 focus:ring-teal-500 focus:outline-none">
              <option value="">Tümü</option>
              <option value="Batı">Batı</option>
              <option value="Doğu">Doğu</option>
              <option value="Türkiye">Türkiye</option>
              <option value="Afrika">Afrika</option>
              <option value="Ka-West">Ka-West</option>
            </select>
          </div>

          <div class="flex flex-col">
            <label class="text-sm font-semibold text-slate-400 mb-2">Polarizasyon</label>
            <select id="filterPol" class="bg-slate-950 border-2 border-slate-800 rounded-xl px-4 py-3.5 text-base text-slate-200 font-medium focus:ring-2 focus:ring-teal-500 focus:outline-none">
              <option value="">Tümü</option>
              <option value="V">V (Dikey)</option>
              <option value="H">H (Yatay)</option>
            </select>
          </div>

          <div class="flex flex-col">
            <label class="text-sm font-semibold text-slate-400 mb-2">Tür</label>
            <select id="filterTur" class="bg-slate-950 border-2 border-slate-800 rounded-xl px-4 py-3.5 text-base text-slate-200 font-medium focus:ring-2 focus:ring-teal-500 focus:outline-none">
              <option value="">Tümü</option>
              <option value="TV">📺 TV</option>
              <option value="RADYO">📻 Radyo</option>
            </select>
          </div>

          <div class="flex items-end">
            <button id="resetFilters" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-base font-bold transition border border-slate-700 shadow">
              Seçimleri Sıfırla
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sonuçlar Listesi (Grid) -->
    <div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
      <!-- Kartlar buraya gelecek -->
    </div>

    <!-- Durum Mesajları -->
    <div id="statusMessage" class="hidden text-center py-20">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-900 border-2 border-slate-800 text-4xl mb-5 shadow-inner">
        🔍
      </div>
      <h3 class="text-2xl font-bold text-white" id="statusTitle">Sonuç bulunamadı</h3>
      <p class="text-base text-slate-400 mt-3" id="statusDesc">Aradığınız isimde bir kanal bulamadık.</p>
    </div>

    <!-- Sayfalama -->
    <div id="pagination" class="hidden text-center py-10">
      <button id="loadMoreBtn" class="px-10 py-4 bg-slate-900 hover:bg-slate-800 border-2 border-slate-700 text-teal-400 font-bold text-lg rounded-2xl transition shadow-xl">
        Daha Fazla Kanal Yükle
      </button>
    </div>

  </main>

  <!-- Kopyalama Toast -->
  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 transform translate-y-32 opacity-0 transition-all duration-300 bg-teal-500 text-slate-950 text-base font-extrabold px-6 py-4 rounded-full shadow-[0_0_30px_rgba(20,184,166,0.5)] flex items-center space-x-3 pointer-events-none">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
    <span id="toastMsg">Frekans kopyalandı!</span>
  </div>

  <script>
    let allChannels = [];
    let filteredChannels = [];
    let displayedCount = 0;
    const PAGE_SIZE = 24;
    let fuse = null;

    const elements = {
      searchInput: document.getElementById('searchInput'),
      clearSearch: document.getElementById('clearSearch'),
      toggleFiltersBtn: document.getElementById('toggleFiltersBtn'),
      filterSectionWrapper: document.getElementById('filterSectionWrapper'),
      filterBtnText: document.getElementById('filterBtnText'),
      filterIcon: document.getElementById('filterIcon'),
      filterKapsama: document.getElementById('filterKapsama'),
      filterPol: document.getElementById('filterPol'),
      filterTur: document.getElementById('filterTur'),
      resetFilters: document.getElementById('resetFilters'),
      resultsContainer: document.getElementById('resultsContainer'),
      stats: document.getElementById('stats'),
      statusMessage: document.getElementById('statusMessage'),
      statusTitle: document.getElementById('statusTitle'),
      statusDesc: document.getElementById('statusDesc'),
      pagination: document.getElementById('pagination'),
      loadMoreBtn: document.getElementById('loadMoreBtn'),
      toast: document.getElementById('toast')
    };

    // Mobil Filtre Aç/Kapat Mantığı
    let filtersOpen = false;
    elements.toggleFiltersBtn.addEventListener('click', () => {
      filtersOpen = !filtersOpen;
      if (filtersOpen) {
        elements.filterSectionWrapper.classList.remove('hidden');
        elements.filterBtnText.textContent = "Filtreleri Gizle";
        elements.filterIcon.classList.add('rotate-180');
      } else {
        elements.filterSectionWrapper.classList.add('hidden');
        elements.filterBtnText.textContent = "Detaylı Filtreleri Göster";
        elements.filterIcon.classList.remove('rotate-180');
      }
    });

    async function loadChannels() {
      try {
        const res = await fetch('kanallar.json');
        if (!res.ok) throw new Error('Yüklenemedi');
        allChannels = await res.json();
        
        fuse = new Fuse(allChannels, {
          keys: [
            { name: 'kanal', weight: 2.0 },
            { name: 'frekans', weight: 1.0 },
            { name: 'paket', weight: 0.5 }
          ],
          threshold: 0.2,
          distance: 100,
          ignoreLocation: true,
          useExtendedSearch: true
        });

        applyFilters();
      } catch (err) {
        showStatus('Kanal Listesi Yüklenemedi', 'İnternet bağlantınızı kontrol edin.');
        elements.stats.textContent = 'Hata';
      }
    }

    function applyFilters() {
      const query = elements.searchInput.value.trim();
      const kapsama = elements.filterKapsama.value;
      const pol = elements.filterPol.value;
      const tur = elements.filterTur.value;

      elements.clearSearch.classList.toggle('hidden', query.length === 0);

      let results = allChannels;

      if (query.length > 0 && fuse) {
        let searchResults = fuse.search(query).map(item => item.item);
        const queryLower = query.toLowerCase();
        
        results = searchResults.sort((a, b) => {
          const aKanal = a.kanal.toLowerCase();
          const bKanal = b.kanal.toLowerCase();
          
          if (aKanal === queryLower) return -1;
          if (bKanal === queryLower) return 1;
          
          const startsWithA = aKanal.startsWith(queryLower + ' ');
          const startsWithB = bKanal.startsWith(queryLower + ' ');
          
          if (startsWithA && !startsWithB) return -1;
          if (!startsWithA && startsWithB) return 1;
          
          return 0; 
        });
      }

      results = results.filter(item => {
        const matchK = !kapsama || (item.kapsama && item.kapsama.toLowerCase().includes(kapsama.toLowerCase()));
        const matchP = !pol || (item.polarizasyon && item.polarizasyon.toUpperCase() === pol);
        const matchT = !tur || (item.tur && item.tur.toUpperCase().includes(tur));
        return matchK && matchP && matchT;
      });

      filteredChannels = results;
      displayedCount = 0;
      elements.resultsContainer.innerHTML = '';
      
      elements.stats.textContent = `${filteredChannels.length} Kanal`;

      if (filteredChannels.length === 0) {
        showStatus('Kanal Bulunamadı', 'Farklı bir arama yapın.');
        elements.pagination.classList.add('hidden');
      } else {
        hideStatus();
        renderNextBatch();
      }
    }

    function renderNextBatch() {
      const nextBatch = filteredChannels.slice(displayedCount, displayedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();

      nextBatch.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 hover:border-slate-600 rounded-3xl p-5 flex flex-col justify-between transition-all shadow-lg group";

        let polDisplay = item.polarizasyon;
        if(polDisplay === 'V') polDisplay = 'V (Dikey)';
        if(polDisplay === 'H') polDisplay = 'H (Yatay)';

        const polColor = item.polarizasyon === 'V' 
          ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' 
          : 'bg-blue-500/10 text-blue-400 border-blue-500/30';

        const turIcon = item.tur === 'RADYO' ? '📻' : '📺';
        const turColor = item.tur === 'RADYO' ? 'text-purple-400 bg-purple-500/10' : 'text-indigo-400 bg-indigo-500/10';

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-3 mb-5">
              <h2 class="font-extrabold text-white text-xl sm:text-2xl leading-tight group-hover:text-teal-400 transition-colors line-clamp-2">
                ${item.kanal}
              </h2>
              <span class="text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg border whitespace-nowrap ${polColor}">
                ${polDisplay}
              </span>
            </div>

            <div class="space-y-4 bg-slate-950/70 p-5 rounded-2xl border border-slate-800">
              <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                <span class="text-slate-400 font-semibold text-sm sm:text-base">Frekans</span>
                <span class="font-mono font-black text-slate-100 text-lg sm:text-xl tracking-wide">${item.frekans} <span class="text-xs text-slate-500 font-sans">MHz</span></span>
              </div>
              
              <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                <span class="text-slate-400 font-semibold text-sm sm:text-base">Sembol</span>
                <span class="font-mono font-bold text-slate-200 text-base sm:text-lg">${item.sembol} <span class="text-slate-600 mx-1">/</span> ${item.fec}</span>
              </div>
              
              <div class="flex justify-between items-center text-sm sm:text-base">
                <span class="text-slate-400 font-semibold">Kapsama</span>
                <span class="font-bold text-slate-200">${item.kapsama || '-'}</span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between mt-5 pt-4 border-t border-slate-800">
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-sm font-bold ${turColor}">
              ${turIcon} ${item.tur || 'TV'}
            </span>
            <button 
              onclick="copyParams('${item.frekans}', '${item.polarizasyon}', '${item.sembol}', '${item.fec}')" 
              class="inline-flex items-center gap-2 text-sm sm:text-base font-bold text-teal-400 hover:text-teal-300 bg-teal-500/10 hover:bg-teal-500/20 px-5 py-3 rounded-xl transition-colors border border-teal-500/20"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
              <span>Kopyala</span>
            </button>
          </div>
        `;
        fragment.appendChild(card);
      });

      elements.resultsContainer.appendChild(fragment);
      displayedCount += nextBatch.length;

      elements.pagination.classList.toggle('hidden', displayedCount >= filteredChannels.length);
    }

    window.copyParams = function(frekans, pol, sembol, fec) {
      const text = `${frekans} ${pol} ${sembol} FEC: ${fec}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Kopyalandı: ${text}`);
      });
    };

    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      document.getElementById('toastMsg').textContent = msg;
      elements.toast.classList.remove('translate-y-32', 'opacity-0');
      
      toastTimer = setTimeout(() => {
        elements.toast.classList.add('translate-y-32', 'opacity-0');
      }, 2500);
    }

    function showStatus(title, desc) {
      elements.statusTitle.textContent = title;
      elements.statusDesc.textContent = desc;
      elements.statusMessage.classList.remove('hidden');
    }

    function hideStatus() {
      elements.statusMessage.classList.add('hidden');
    }

    elements.searchInput.addEventListener('input', applyFilters);
    elements.filterKapsama.addEventListener('change', applyFilters);
    elements.filterPol.addEventListener('change', applyFilters);
    elements.filterTur.addEventListener('change', applyFilters);

    elements.clearSearch.addEventListener('click', () => {
      elements.searchInput.value = '';
      applyFilters();
      elements.searchInput.focus();
    });

    elements.resetFilters.addEventListener('click', () => {
      elements.searchInput.value = '';
      elements.filterKapsama.value = '';
      elements.filterPol.value = '';
      elements.filterTur.value = '';
      applyFilters();
    });

    elements.loadMoreBtn.addEventListener('click', renderNextBatch);

    loadChannels();
  </script>
</body>
</html>
