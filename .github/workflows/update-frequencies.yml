name: Türksat Frekanslarını Güncelle

on:
  schedule:
    # Her Pazar gece 03:00 UTC'de otomatik çalışır
    - cron: '0 3 * * 0'
  # GitHub arayüzünden manuel tetikleme imkanı sağlar
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install requests beautifulsoup4

      - name: Frekansları Çek
        run: |
          python scraper.py

      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add kanallar.json
          
          # Yalnızca veride değişiklik varsa commit yap
          if git diff --staged --quiet; then
            echo "Herhangi bir veri değişikliği bulunamadı."
          else
            git commit -m "chore: haftalık Türksat frekans listesi güncellendi [skip ci]"
            git push
          fi